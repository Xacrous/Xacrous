[project]
name = "chartpilot"
version = "0.1.0"
description = "Windows 11 desktop app for crypto technical analysis and signal generation (educational, execution-free)"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.5",
    "pandas>=2.0",
    "numpy>=1.26",
    "pandas-ta-classic>=0.4",
    "PyQt6>=6.6",
    "PyQt6-WebEngine>=6.6",
    "PyQt6-Fluent-Widgets>=1.11",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chartpilot*"]
