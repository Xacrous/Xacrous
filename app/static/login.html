<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · BTC Trend Bot</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%82%BF%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <form id="login" class="login-card" autocomplete="on">
    <div class="brand">₿ BTC Trend Bot</div>
    <label>Username <input name="username" autocomplete="username" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <label id="code-row" class="hidden">Authenticator code
      <input name="code" inputmode="numeric" pattern="[0-9 ]{6,7}" autocomplete="one-time-code" maxlength="7">
    </label>
    <button type="submit">Sign in</button>
    <p id="error" class="login-error" role="alert"></p>
  </form>
  <script src="/static/login.js"></script>
</body>
</html>
